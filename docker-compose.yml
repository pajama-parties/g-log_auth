# 로컬 개발용 PostgreSQL 17 — `npm run db:up` 으로 실행
# DB 하나(DB_NAME)에 auth·service 스키마를 둠. 스키마와 테이블은 마이그레이션(npm run migration:run)이 만듦
services:
  postgres:
    image: postgres:17
    container_name: glog-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
      TZ: UTC
      PGTZ: UTC
    ports:
      - '${DB_PORT}:5432'
    volumes:
      - glog-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  glog-postgres-data:
