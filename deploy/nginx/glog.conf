# g-log 서버용 nginx 설정 → /etc/nginx/sites-available/glog (sites-enabled에 링크)
# 외부에는 443만 공개하고, 도커로 띄운 두 서버(127.0.0.1:3000, :3001)로 경로를 나눠 보냄.
#   auth 서버(3000): /api/auth/*  /api/me  /auth/* (카카오 콜백·개발용 로그인)
#   서비스 API(3001): 그 밖의 /api/* (스웨거 /api/docs, 사진 /api/uploads/*)
# 인증서: 도메인을 붙이기 전에는 자체 서명 인증서(/etc/nginx/ssl/glog.*). 도메인을 붙이면 certbot으로 바꾸고 server_name을 채움

upstream glog_auth { server 127.0.0.1:3000; }
upstream glog_api  { server 127.0.0.1:3001; }

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name _;

    ssl_certificate     /etc/nginx/ssl/glog.crt;
    ssl_certificate_key /etc/nginx/ssl/glog.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    # 커뮤니티 사진은 5MB까지 (photo-storage.ts의 MAX_PHOTO_BYTES) + 폼 필드 여유
    client_max_body_size 6m;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location ^~ /api/auth/ { proxy_pass http://glog_auth; }
    location ^~ /api/me    { proxy_pass http://glog_auth; }
    location ^~ /auth/     { proxy_pass http://glog_auth; }

    location / { proxy_pass http://glog_api; }
}
